<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container-calculator">
      <div class="title-container">
        <h1>Calculator</h1>
      </div>
      <div class="screen">
        <div class="screen-container">
          <p class="operation"></p>
          <p class="answer"></p>
        </div>
      </div>
      <div class="button-container">
        <button class="operation-button parentheses">(</button>
        <button class="operation-button parentheses">)</button>
        <button class="operation-button">%</button>
        <button id="ac-button">AC</button>
      </div>
      <div class="button-container">
        <button class="number-button">1</button>
        <button class="number-button">2</button>
        <button class="number-button">3</button>
        <button class="operation-button">+</button>
      </div>
      <div class="button-container">
        <button class="number-button">4</button>
        <button class="number-button">5</button>
        <button class="number-button">6</button>
        <button class="operation-button">-</button>
      </div>
      <div class="button-container">
        <button class="number-button">7</button>
        <button class="number-button">8</button>
        <button class="number-button">9</button>
        <button class="operation-button">X</button>
      </div>
      <div class="button-container">
        <button class="number-button">0</button>
        <button class="number-button" id="period">.</button>
        <button id="equal-button">=</button>
        <button class="operation-button">/</button>
      </div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
